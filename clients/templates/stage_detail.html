{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="relative bg-gray-50 text-gray-800 min-h-screen overflow-hidden" style="font-family: 'SF Pro Display', sans-serif;">

  <!-- Фоновые линии -->
  <div class="absolute inset-0 pointer-events-none">
    <img src="{% static 'img/line2.svg' %}" alt="line2" class="absolute top-10 left-0 w-32 md:w-48">
    <img src="{% static 'img/line3.svg' %}" alt="line3" class="absolute bottom-0 left-0 w-40 md:w-56">
    <img src="{% static 'img/line4.svg' %}" alt="line4" class="absolute bottom-5 left-1/2 transform -translate-x-1/2 w-48 md:w-72">
    <img src="{% static 'img/line5.svg' %}" alt="line5" class="absolute top-0 right-0 w-40 md:w-64">
    <img src="{% static 'img/line7.svg' %}" alt="line7" class="absolute top-[700px] right-6 transform -translate-y-1/2 w-36 md:w-56">
    <img src="{% static 'img/line8.svg' %}" alt="line8" class="absolute top-0 left-1/3 -translate-x-full w-[500px]">
    <img src="{% static 'img/line9.svg' %}" alt="line9" class="absolute top-[500px] left-[500px] w-32 md:w-[400px]">
  </div>

  <!-- Контент -->
  <div class="relative max-w-5xl mx-auto px-6 py-12 space-y-16">

    <!-- Лого -->
    <div class="flex justify-center mt-8">
      <img src="{% static 'img/logo1.svg' %}" alt="Логотип" class="w-56 h-auto">
    </div>

    <!-- Блок 1 — Описание стадии -->
    <section class="bg-gradient-to-tr from-white to-blue-100 shadow-md rounded-2xl p-8 space-y-6 text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-700" style="font-family: 'TT Norms Medium', sans-serif;">
        {{ stage.name }}
      </h1>

      <div class="text-lg text-slate-600 space-y-4">
        {{ stage.description|linebreaks }}
      </div>

      {% if next_stage %}
        <p class="text-slate-700 font-bold mt-4">
          Следующая стадия: 
          <a href="{% url 'stage_detail' next_stage.slug %}" class="text-blue-600 hover:underline">
            {{ next_stage.name }}
          </a>
        </p>
      {% endif %}
    </section>

    <!-- Блок 2 — Реферальная программа -->
    <section class="bg-gradient-to-tr from-white to-blue-100 shadow-md rounded-2xl p-8 space-y-6 text-center">
      <h2 class="text-2xl md:text-3xl font-bold text-slate-700" style="font-family: 'TT Norms Medium', sans-serif;">
        Реферальная программа
      </h2>

      <p class="text-lg text-slate-600">
        Приглашайте друзей и получайте бонусы!
      </p>

      <div class="flex justify-center">
        <a href="{% url 'referral_page' %}"
           class="inline-flex items-center gap-3 px-6 py-3 bg-gradient-to-r from-green-400 to-blue-400 text-white rounded-full shadow hover:from-green-500 hover:to-blue-500 transition text-lg font-semibold">
          Подробнее
        </a>
      </div>
    </section>

  </div>
</div>
{% endblock %}
