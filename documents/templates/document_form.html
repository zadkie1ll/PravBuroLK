<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Генерация документа</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white shadow-lg rounded-xl w-full max-w-2xl p-6">
    <h1 class="text-2xl font-bold mb-6 text-center">Генерация документа</h1>

    <form method="post" action="{% url 'generate_document' %}" class="space-y-6">
      {% csrf_token %}

      <!-- Основная информация -->
      <div class="space-y-4">
        <h2 class="text-lg font-semibold border-b pb-2 mb-2">Основная информация</h2>

        <div>
          <label class="block font-medium mb-1">ФИО</label>
          <input type="text" name="full_name" required
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
        </div>

        <div>
          <label class="block font-medium mb-1">Дата рождения</label>
          <input type="date" name="birth_date"
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
        </div>

        <div>
          <label class="block font-medium mb-1">Паспорт</label>
          <input type="text" name="passport"
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
        </div>

        <div>
          <label class="block font-medium mb-1">Адрес</label>
          <input type="text" name="address"
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
        </div>

        <div>
          <label class="block font-medium mb-1">Комментарий</label>
          <textarea name="comment"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2"></textarea>
        </div>

        <div>
          <label class="block font-medium mb-1">Номер дела</label>
          <input type="text" name="case_number" placeholder="Например: А45-10491/2025"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
        </div>
      </div>

      <!-- Арбитражный суд (вынесен отдельно) -->
      <div class="space-y-4">
        <h2 class="text-lg font-semibold border-b pb-2 mb-2">Арбитражный суд</h2>

        <div>
          <label class="block font-medium mb-1">Название суда</label>
          <input type="text" name="court_name" placeholder="Арбитражный суд Новосибирской области"
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
        </div>
      </div>


      <div class="space-y-4 mt-8">
  <h2 class="text-lg font-semibold border-b pb-2 mb-2">Возмещения убытков</h2>

  <div id="loss-list" class="space-y-6"></div>

  <button type="button" id="add-loss"
          class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
    + Добавить убыток
  </button>
</div>

      <!-- Блок кредиторов -->
      <div class="space-y-4">
        <h2 class="text-lg font-semibold border-b pb-2 mb-2">Кредиторы</h2>

        <div id="creditor-list" class="space-y-6"></div>

        <button type="button" id="add-creditor"
                class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
          + Добавить кредитора
        </button>
      </div>

      <div>
        <label class="block font-medium mb-1">Сумма для распределения</label>
        <input
            type="number"
            step="0.01"
            name="distribution_sum"
            required
            class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2"
        >
      </div>

      <div class="text-center">
        <button type="submit"
                class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 focus:outline-none">
          Сгенерировать
        </button>
      </div>
    </form>
  </div>

<script>
document.getElementById("add-creditor").addEventListener("click", function () {
    const container = document.getElementById("creditor-list");

    const row = document.createElement("div");
    row.className = "border p-4 rounded-lg bg-gray-50 space-y-3";

    row.innerHTML = `
      <div class="flex gap-3 items-center">
        <input type="text" name="creditors[]" placeholder="Кредитор"
               class="flex-1 border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">

        <input type="number" name="amounts[]" placeholder="Сумма"
               class="w-40 border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">

        <button type="button"
                class="text-red-500 font-bold text-xl remove-row">
          ×
        </button>
      </div>

      <div>
        <label class="text-sm text-gray-600">Дата определения суда</label>
        <input type="date" name="court_date[]"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
      </div>
    `;

    container.appendChild(row);

    row.querySelector(".remove-row").addEventListener("click", () => row.remove());
});
</script>


<script>
document.getElementById("add-creditor").addEventListener("click", function () {
    const container = document.getElementById("creditor-list");

    const row = document.createElement("div");
    row.className = "border p-4 rounded-lg bg-gray-50 space-y-3";

    row.innerHTML = `
      <div class="flex gap-3 items-center">
        <input type="text" name="creditors[]" placeholder="Кредитор"
               class="flex-1 border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">

        <input type="number" name="amounts[]" placeholder="Сумма"
               class="w-40 border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">

        <button type="button"
                class="text-red-500 font-bold text-xl remove-row">
          ×
        </button>
      </div>

      <div>
        <label class="text-sm text-gray-600">Дата определения суда</label>
        <input type="date" name="court_date[]"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">
      </div>
    `;

    container.appendChild(row);

    row.querySelector(".remove-row").addEventListener("click", () => row.remove());
});


// === БЛОК УБЫТКОВ ===
document.getElementById("add-loss").addEventListener("click", function () {
    const container = document.getElementById("loss-list");

    const row = document.createElement("div");
    row.className = "border p-4 rounded-lg bg-gray-50 space-y-3";

    row.innerHTML = `
      <div class="flex gap-3 items-center">
        <input type="text" name="loss_org[]" placeholder="Организация"
               class="flex-1 border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">

        <input type="number" name="loss_amount[]" placeholder="Сумма"
               class="w-40 border border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:ring-2">

        <button type="button"
                class="text-red-500 font-bold text-xl remove-row">
          ×
        </button>
      </div>
    `;

    container.appendChild(row);

    row.querySelector(".remove-row").addEventListener("click", () => row.remove());
});
</script>

</body>
</html>
