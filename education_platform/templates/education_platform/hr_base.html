<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"LMS HR" }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f3f5f7; color: #222; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 8px 12px; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; color: #111; text-decoration: none; cursor: pointer; }
        .btn.primary { background: #0f62fe; color: #fff; border-color: #0f62fe; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .muted { color: #667085; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #eef2ff; color: #344054; font-size: 13px; margin: 2px; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
        .ok { color: #067647; font-weight: 600; }
        .bad { color: #b42318; font-weight: 600; }
        ul { margin: 8px 0; padding-left: 20px; }
        form p { margin: 8px 0; }
        label { font-weight: 600; }
        input, textarea, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #d0d7de; box-sizing: border-box; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .messages { margin-bottom: 16px; }
        .msg { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <h1>{{ title|default:"LMS HR" }}</h1>
        <div class="actions">
            <a class="btn" href="{% url 'education_hr_dashboard' %}">Каталог LMS</a>
            <a class="btn" href="{% url 'education_hr_trainees' %}">Стажеры</a>
        </div>
    </div>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="msg">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
