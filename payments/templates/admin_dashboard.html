{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Шапка -->
    <header class="bg-white shadow p-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-800">Админ-панель</h1>
            <a href="/" class="text-blue-600 hover:underline">На главную</a>
        </div>
    </header>

    <!-- Контент -->
    <main class="flex-1 max-w-7xl mx-auto p-6">
        <div class="bg-white p-8 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Добро пожаловать в админ-панель</h2>
            <p class="text-gray-600">Здесь будет функционал для управления системой.</p>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="bg-white shadow p-4 text-center text-gray-500 text-sm">
        © {{ now|date:"Y" }} CRM
    </footer>

</body>
</html>
