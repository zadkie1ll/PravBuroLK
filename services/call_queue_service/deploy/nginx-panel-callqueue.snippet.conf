# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru
# (/etc/nginx/sites-available/panel.prav-buro.ru на сервере), рядом с остальными
# location-блоками, ДО общего "location /".
#
# У backend'а нет /api-префикса (маршруты /auth/*, /queue/* напрямую), поэтому,
# как и у leadreport_service, backend вынесен под отдельный префикс /callqueue-api,
# а не /callqueue/api — иначе не разграничить с фронтенд-страницами SPA.

location /callqueue-api/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /callqueue/ {
    proxy_pass http://127.0.0.1:5173/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
