# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru
# (/etc/nginx/sites-available/panel.prav-buro.ru на сервере), рядом с остальными
# location-блоками, ДО общего "location /".
#
# Backend уже отдаёт всё под /api — коллизий с фронтенд-страницами SPA нет
# (та же схема, что у urlshorter/referral_stats).

location /clients/api/ {
    proxy_pass http://127.0.0.1:8008/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /clients/health {
    proxy_pass http://127.0.0.1:8008/health;
}

location /clients/ {
    proxy_pass http://127.0.0.1:5177/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
