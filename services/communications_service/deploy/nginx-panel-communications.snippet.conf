# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru, рядом с остальными
# location-блоками, ДО общего "location /". Нет фронтенда — только backend (webhook +
# manualAnalyze), поэтому один префикс, как у lead_control.
#
# ВАЖНО: сама Bitrix-автоматика (voximplant call-end) пока НЕ дёргает этот адрес — там
# прописан адрес монолита. Этот location только для ручной проверки (curl/health, ручной
# manualAnalyze), реальный трафик пойдёт сюда только после того, как в Bitrix поменяют URL.

location /communications/ {
    proxy_pass http://127.0.0.1:8004/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
