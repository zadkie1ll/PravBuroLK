# Свой поддомен, не часть панели сотрудников (panel.prav-buro.ru) — страница
# клиентская, поэтому отдельный server{} блок, а не сниппет для вставки туда.
# HTTPS обычно донастраивает certbot (добавляет свой listen 443 ssl отдельно) —
# этот файл только про проксирование на бэкенд/фронтенд.

server {
    listen 80;
    listen [::]:80;
    server_name pdf.prav-buro.ru;

    location /api/ {
        proxy_pass http://127.0.0.1:8012/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8012/health;
    }

    location / {
        proxy_pass http://127.0.0.1:5180/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
