# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru, рядом с остальными
# location-блоками, ДО общего "location /". Нет фронтенда — только backend
# (генерация договора + клиентские страницы подтверждения/оплаты), один префикс.

location /documents/ {
    proxy_pass http://127.0.0.1:8005/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
