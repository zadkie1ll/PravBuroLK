# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru
# (/etc/nginx/sites-available/panel.prav-buro.ru на сервере), рядом с остальными
# location-блоками, ДО общего "location /".
#
# У backend'а нет /api-префикса (маршруты /auth/*, /hr/*, /courses и т.п. напрямую),
# поэтому, как и у leadreport_service/callqueue, backend вынесен под отдельный
# префикс /education-api, а не /education/api — иначе не разграничить с
# фронтенд-страницами SPA.

location /education-api/ {
    proxy_pass http://127.0.0.1:8003/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Видео-модули могут отдаваться крупными файлами (см. app/routers/files.py).
    client_max_body_size 200M;
}

location /education/ {
    proxy_pass http://127.0.0.1:5174/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
