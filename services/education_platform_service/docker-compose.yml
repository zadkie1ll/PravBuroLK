name: education_platform_service

services:
  backend:
    build: ./backend
    container_name: education_platform_backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://pravburo:pravburo@shared_postgres:5432/pravburo}
    volumes:
      - ./backend:/app
      - ${MONOLITH_PRIVATE_MEDIA_PATH:-../../private_media}:/private_media:ro
    ports:
      - "8003:8003"
    networks:
      - default
      - pravburo_shared

  frontend:
    build: ./frontend
    container_name: education_platform_frontend
    environment:
      VITE_BACKEND_URL: http://localhost:8003
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - backend

networks:
  pravburo_shared:
    external: true
