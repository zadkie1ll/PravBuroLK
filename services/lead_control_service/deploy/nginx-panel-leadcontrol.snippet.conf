# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru, рядом с остальными
# location-блоками, ДО общего "location /". Нет фронтенда — только backend (webhook +
# internal API), поэтому один префикс.
#
# ВАЖНО: сам webhook Bitrix-автоматика пока НЕ дёргает (там прописан адрес монолита) —
# этот location только для ручной проверки (curl/health), реальный трафик пойдёт сюда
# только после того, как в настройках Bitrix-автоматики поменяют URL вручную.

location /leadcontrol/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
