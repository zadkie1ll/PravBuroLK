# Вставить внутрь существующего HTTPS server{} выбранного домена.
# Секрет находится в URL: отключаем access log для этого endpoint.
location ^~ /webhooks/bitrix24/ {
    access_log off;
    error_log /dev/null;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8013;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
}
