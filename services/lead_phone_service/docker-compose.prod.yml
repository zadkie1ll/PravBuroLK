name: lead_phone_service
services:
  backend:
    build: .
    container_name: lead_phone_backend
    network_mode: host
    env_file: .env
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - queue_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  queue_data:
