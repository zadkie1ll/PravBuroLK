# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru
# (/etc/nginx/sites-available/panel.prav-buro.ru на сервере), рядом с остальными
# location-блоками, ДО общего "location /".
#
# ВАЖНО: backend у leadreport_service отдаёт /admin/managers-list и т.п. без /api-
# префикса — те же самые пути, что и у фронтенд-страниц SPA (/leadreport/admin/...).
# Поэтому backend вынесен под отдельный префикс /leadreport-api, а не /leadreport/api —
# иначе nginx не сможет однозначно решить, кому проксировать запрос.

location /leadreport-api/ {
    proxy_pass http://127.0.0.1:8006/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /leadreport/ {
    proxy_pass http://127.0.0.1:5175/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
