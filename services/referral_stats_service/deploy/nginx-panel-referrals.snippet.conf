# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru
# (/etc/nginx/sites-available/panel.prav-buro.ru на сервере), рядом с остальными
# location-блоками, ДО общего "location /".
#
# Backend уже отдаёт всё под /api (см. app/routers/stats.py, visits.py) — коллизий
# с фронтенд-страницами SPA нет, поэтому один префикс /referrals на оба (как у urlshorter).

location /referrals/api/ {
    proxy_pass http://127.0.0.1:8009/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /referrals/health {
    proxy_pass http://127.0.0.1:8009/health;
}

location /referrals/ {
    proxy_pass http://127.0.0.1:5178/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
