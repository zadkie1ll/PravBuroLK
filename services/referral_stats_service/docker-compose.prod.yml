name: referral_stats_service

# Прод-вариант: network_mode: host (Postgres на сервере слушает только 127.0.0.1).
# Сервис живёт под panel.prav-buro.ru/referrals — backend уже под /api-префиксом,
# коллизий с фронтенд-страницами SPA нет (в отличие от leadreport_service), поэтому
# отдельный "-api" префикс не нужен, как у urlshorter_service.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  backend:
    build: ./backend
    container_name: referral_stats_backend
    network_mode: host
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8009"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: "https://panel.prav-buro.ru/referrals"
        VITE_ADMIN_PANEL_BASE_URL: "https://panel.prav-buro.ru"
        DEPLOY_BASE_PATH: "/referrals/"
    container_name: referral_stats_frontend
    network_mode: host
    environment:
      NGINX_PORT: "5178"
    restart: unless-stopped
