# Вставить ВНУТРЬ существующего server{} блока panel.prav-buro.ru
# (services/admin_panel_service/deploy/nginx-panel.prav-buro.ru.conf на сервере),
# ДО общего "location /" этого файла — nginx матчит по длине префикса, но раз
# location /urlshorter/... начинаются на /urlshorter, порядок не критичен, кладём
# рядом с остальными location-блоками для читаемости.
#
# Это параллельный тест на пути /urlshorter — публичный редирект /url/?source=...
# остаётся на prav-buro.ru (реальные расшаренные ссылки), сюда не переносится.

location /urlshorter/api/ {
    proxy_pass http://127.0.0.1:8011/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /urlshorter/health {
    proxy_pass http://127.0.0.1:8011/health;
}

location /urlshorter/ {
    proxy_pass http://127.0.0.1:5179/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
