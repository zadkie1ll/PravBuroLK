# Вставить ВНУТРЬ существующего server{} блока prav-buro.ru (основной сайт),
# ДО общего "location /" этого файла.
#
# Публичный редирект по коротким UTM-ссылкам (созданным через новую панель,
# конструктор ссылок urlshorter_service). Ведёт прямо на бэкенд urlshorter,
# минуя фронтенд-сервис - раздавать статику фронтенда здесь не нужно.
#
# Старый /url?source=... (модель UrlShortener) - отдельный, более старый
# механизм, если он уже проксируется где-то в этом же файле - не трогать,
# этот сниппет его не заменяет.

location /go {
    proxy_pass http://127.0.0.1:8011/go;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
