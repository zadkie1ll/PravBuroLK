<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поздравление с 8 Марта</title>
  <style>
    :root {
      --ink: #0f0f21;
      --gold: #fde68a;
      --pink: #f472b6;
      --glass: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, #4c1d95 0%, transparent 28%),
        radial-gradient(circle at 85% 12%, #9f1239 0%, transparent 25%),
        radial-gradient(circle at 35% 85%, #1e3a8a 0%, transparent 30%),
        linear-gradient(145deg, #0f172a, #3b0764);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .card {
      width: min(980px, 100%);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: var(--glass);
      backdrop-filter: blur(9px);
      box-shadow: 0 32px 70px rgba(0, 0, 0, 0.35);
      display: grid;
      grid-template-columns: 1.2fr 1fr;
    }

    .left {
      padding: 38px;
      {% if greeting.custom_background %}
      background:
        linear-gradient(0deg, rgba(15, 15, 33, 0.68), rgba(15, 15, 33, 0.68)),
        url("{{ greeting.custom_background.url }}") center/cover no-repeat;
      {% else %}
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      {% endif %}
    }

    .title {
      margin: 0;
      font-size: 38px;
      letter-spacing: 0.6px;
      color: var(--gold);
    }

    .name {
      margin: 12px 0 0;
      font-size: 28px;
      font-weight: 700;
    }

    .text {
      margin: 20px 0 0;
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .badges {
      margin-top: 26px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      border: 1px solid rgba(255, 255, 255, 0.33);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.2);
    }

    .right {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: center;
      background: rgba(5, 6, 25, 0.35);
    }

    .astro {
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: block;
    }

    .btn {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      color: #221030;
      background: linear-gradient(90deg, #fbbf24, #f472b6);
      padding: 13px 16px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform .2s ease, opacity .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    @media (max-width: 860px) {
      .card { grid-template-columns: 1fr; }
      .left, .right { padding: 22px; }
      .title { font-size: 31px; }
      .name { font-size: 24px; }
    }
  </style>
</head>
<body>
  <article class="card">
    <section class="left">
      <h1 class="title">С 8 Марта</h1>
      <p class="name">{{ greeting.recipient_name }}</p>
      <p class="text">{{ greeting.personal_text }}</p>
      <div class="badges">
        <span class="badge">Зодиак: {{ zodiac_sign }}</span>
        <span class="badge">Число судьбы: {{ numerology_number }}</span>
      </div>
    </section>
    <section class="right">
      <img class="astro" src="{% if greeting.astrology_image %}{{ greeting.astrology_image.url }}{% else %}{% url 'telki:astrology-image' greeting.token %}{% endif %}" alt="Астрологическая картинка">
      {% if greeting.certificate_pdf %}
      <a class="btn" href="{% url 'telki:certificate-pdf' greeting.token %}">Скачать PDF-сертификат</a>
      {% endif %}
    </section>
  </article>
</body>
</html>
